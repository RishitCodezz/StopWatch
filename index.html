<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stopwatch">
        <h1 class="Displaytime">00:00:00</h1>
        <div class="buttons">
            <img src="images/stop.png" class="btn-stop" alt="Stop Button" onclick="watchstop()">
            <img src="images/start.png" class="btn-start" alt="Start Button" onclick="watchstart()">
            <img src="images/reset.png" class="btn-reset" alt="Reset Button" onclick="watchreset()">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
